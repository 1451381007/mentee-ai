version: '3'
services:
  frontend:
    build: .
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    image: your-backend-image  # 替换为您的后端镜像
    ports:
      - "3000:3000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge 